schema_version: 1

context:
  version: 0.8.1

package:
  name: speculators
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/speculators/speculators-${{ version }}.tar.gz
  sha256: acc50593b3af3898ab0add47b4288375291c68c389149c2f38f41cb16d3c1ccb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=82.0.1
    - setuptools-git-versioning >=2.0,<3
    - packaging
    - pip
  run:
    - python >=${{ python_min }}
    - hs-connectors ${{ version }}.*
    - click
    - datasets >=4.0.0,<=5.0.1
    - huggingface_hub
    - loguru >=0.7.2,<=0.7.3
    - numpy >=2.0.0,<=2.4.6
    - openai >=2.0.0
    - protobuf
    - psutil
    - pydantic >=2.0.0
    - pydantic-settings >=2.0.0
    - rich
    - safetensors
    - pytorch >=2.9.0,<=2.13.0
    - torchaudio
    - torchvision
    - tqdm >=4.66.3,<=4.70.0
    - transformers >=5.0.0,<5.17.0
    - typer >=0.12.0
    - httpx
    - hs-connectors >0.8.0,<=0.8.1
    - aiohttp
tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - '*'
      imports:
        - speculators
      pip_check: true

about:
  summary: A unified library for creating, representing, and storing speculative decoding algorithms for LLM serving such as in vLLM.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/speculators/

extra:
  recipe-maintainers:
    - xhochy
