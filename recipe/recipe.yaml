schema_version: 1

context:
  version: 0.9.0

package:
  name: speculators
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/speculators/speculators-${{ version }}.tar.gz
  sha256: ad5e21eedc89f95096d92ceeccb794df88e24394615f5e8f02957485aea3d8cf
  patches:
    # setup.py only treats a source tree as an sdist if the directory is named
    # speculators-<version>, so from a rattler-build work dir it recomputes a
    # version from git tags (which do not exist) and pins the wrong
    # hs-connectors release.
    - patches/0001-fix-sdist-detection.patch

build:
  number: 0
  noarch: python
  script:
    content: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
    env:
      # setup.py derives the hs-connectors requirement from the build type and
      # defaults to "nightly", which emits a range that excludes the matching
      # release of hs-connectors and fails `pip check`.
      SPECULATORS_BUILD_TYPE: release

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=84.0.0
    - setuptools-git-versioning >=2.0,<3
    - packaging
    - pip
  run:
    - python >=${{ python_min }}
    - hs-connectors ==${{ version }}
    - click
    - datasets >=4.0.0,<=5.1.0
    - huggingface_hub
    - loguru >=0.7.2,<=0.7.3
    - numpy >=2.0.0,<=2.5.4
    - openai >=2.0.0
    - protobuf
    - psutil
    - pydantic >=2.0.0
    - pydantic-settings >=2.0.0
    - rich
    - safetensors
    - pytorch >=2.9.0,<=2.14.1
    - torchaudio
    - torchvision
    - tqdm >=4.66.3,<=4.70.1
    - transformers >=5.0.0,<=5.19.0
    - typer >=0.12.0
    - httpx
    - aiohttp
tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - '*'
      imports:
        - speculators
      pip_check: true

about:
  summary: A unified library for creating, representing, and storing speculative decoding algorithms for LLM serving such as in vLLM.
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/speculators/

extra:
  recipe-maintainers:
    - xhochy
